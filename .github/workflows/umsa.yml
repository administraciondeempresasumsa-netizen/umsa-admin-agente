
name: UMSA Admin Agente - 7am La Paz

on:
  schedule:
    - cron: '0 11 * * *' # 7am La Paz = 11am UTC
  workflow_dispatch:

jobs:
  generar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests pytz google-auth google-auth-oauthlib
      - name: Generar video UMSA
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          FLOW_API_KEY: ${{ secrets.FLOW_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: project-d0370989-463f-4179-a4e
        run: python main.py
